<!-- templates/account/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Finora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FA] h-screen flex items-center justify-center antialiased">
    
    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-[0_2px_20px_rgb(0,0,0,0.04)] w-full max-w-md border border-gray-50">
        
        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 text-2xl font-bold text-gray-900 mb-8">
            <i data-lucide="layers" class="w-7 h-7 text-indigo-600"></i> Finora
        </div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-2">Please sign in to your account.</p>
        </div>

        <form method="post" action="{% url 'account_login' %}" class="space-y-5">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
            <div class="bg-rose-50 text-rose-600 p-3 rounded-lg text-sm text-center">
                {{ form.non_field_errors.0 }}
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="login" placeholder="you@example.com" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50/50 focus:bg-white text-sm">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <a href="{% url 'account_reset_password' %}" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Forgot?</a>
                </div>
                <input type="password" name="password" placeholder="••••••••" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50/50 focus:bg-white text-sm">
            </div>

            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-sm shadow-indigo-200 mt-2">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-8">
            Don't have an account? 
            <a href="{% url 'account_signup' %}" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
